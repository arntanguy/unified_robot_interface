MainRobot: OpenArmV2
Enabled: Posture
Timestep: 0.005

LogPolicy : threaded

ObserverPipelines:
  - name: OpenArmEncoder
    gui: true
    observers:
      - type: Encoder
        robot: openarm
        updateRobot: openarm

Robots:
  openarm:
    module: OpenArmV2          # mc_rtc RobotModule name (as installed by mc_openarm)
    network_interface:
      protocol: zenoh
    robot_interface:
      driver: RobotDriverROS2Control
      control_mode: position
      # Unused by this driver (topics/joints come from config_path below),
      # but required by RobotManager::processGConfig's validation.
      ip: 127.0.0.1
      port: 0
      # Driver-specific YAML, forwarded as-is to the driver's create()/constructor
      # (see ros2_control_driver/etc/openarm_bimanual.yaml).
      config_path: /home/tduvinage/devel/sandbox/ros2_control_driver/etc/openarm_bimanual.yaml
      # Co-located: no separate robot-side PC, controller_manager runs on
      # this same machine against the live sim.
      autostart: true
